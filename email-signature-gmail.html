<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Riley Email Signature - Gmail Compatible</title>
</head>
<body style="margin: 0; padding: 20px; font-family: Arial, sans-serif; background-color: #f8fafc;">

  <!-- Email Signature Container (Gmail Compatible) -->
  <table cellpadding="0" cellspacing="0" border="0" style="font-family: Arial, Helvetica, sans-serif; font-size: 14px; line-height: 1.5; color: #334155; max-width: 600px;">
    <tr>
      <td style="padding: 20px 0;">

        <!-- Logo and Name Section -->
        <table cellpadding="0" cellspacing="0" border="0">
          <tr>
            <!-- Logo -->
            <td style="padding-right: 10px; vertical-align: middle;">
              <img src="https://teamrileyweb.com/logo.png" alt="Team Riley Logo" width="48" height="48" style="display: block; border: 0;" />
            </td>
            <!-- Name and Company -->
            <td style="vertical-align: middle; padding-left: 10px;">
              <div style="font-size: 18px; font-weight: 700; color: #1e40af; line-height: 1.3; margin-bottom: 2px;">
                Joshua Riley
              </div>
              <div style="font-size: 12px; font-weight: 700; color: #334155; line-height: 1.3; letter-spacing: 2px;">
                TEAM RILEY
              </div>
            </td>
          </tr>
        </table>

        <!-- Divider -->
        <div style="height: 1px; background-color: #cbd5e1; margin: 16px 0; max-width: 300px;"></div>

        <!-- Contact Information -->
        <table cellpadding="0" cellspacing="0" border="0" style="font-size: 14px;">
          <!-- Email -->
          <tr>
            <td style="padding: 6px 8px 6px 0; vertical-align: middle;">
              <img src="https://img.icons8.com/pulsar-gradient/48/filled-message.png" alt="Email" width="20" height="20" style="display: block; border: 0;" />
            </td>
            <td style="padding: 6px 0; vertical-align: middle;">
              <a href="mailto:josh@teamrileyweb.com" style="color: #334155; text-decoration: none; font-weight: 500;">josh@teamrileyweb.com</a>
            </td>
          </tr>
          <!-- Phone -->
          <tr>
            <td style="padding: 6px 8px 6px 0; vertical-align: middle;">
              <img src="https://img.icons8.com/pulsar-gradient/48/phone-message.png" alt="Phone" width="20" height="20" style="display: block; border: 0;" />
            </td>
            <td style="padding: 6px 0; vertical-align: middle;">
              <a href="tel:+12256144765" style="color: #334155; text-decoration: none; font-weight: 500;">(225) 614-4765</a>
            </td>
          </tr>
          <!-- Website -->
          <tr>
            <td style="padding: 6px 8px 6px 0; vertical-align: middle;">
              <img src="https://img.icons8.com/pulsar-gradient/48/globe.png" alt="Website" width="20" height="20" style="display: block; border: 0;" />
            </td>
            <td style="padding: 6px 0; vertical-align: middle;">
              <a href="https://teamrileyweb.com" style="color: #334155; text-decoration: none; font-weight: 500;">teamrileyweb.com</a>
            </td>
          </tr>
        </table>

        <!-- CTA Button -->
        <table cellpadding="0" cellspacing="0" border="0" style="margin-top: 20px;">
          <tr>
            <td style="background-color: #1e40af; border-radius: 8px; padding: 10px 24px;">
              <a href="https://cal.com/joshua-riley/intro-call" style="color: #ffffff; text-decoration: none; font-weight: 600; font-size: 13px; display: block;">
                Schedule a Call →
              </a>
            </td>
          </tr>
        </table>

      </td>
    </tr>
  </table>

</body>
</html>
