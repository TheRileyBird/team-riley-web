# One repo, three Netlify sites (health, law, finance). Each site sets SITE_VERTICAL in
# its own environment (Site configuration > Environment variables). Without it the build
# fails on purpose rather than publishing the wrong market. See src/verticals/index.ts.
#
# `ignore` lets a site skip a push that only touches another market's files, drafts or
# docs. Production deploys cost credits per site; skipped builds never deploy.
[build]
  command = "npm run build"
  publish = "dist"
  ignore = "node scripts/netlify-ignore.mjs"

# No SPA catch-all. This is a static multi-page Astro site, and a
# `from = "/*" -> "/index.html"` rewrite at status 200 made every dead URL answer
# with the homepage and an HTTP 200 — a soft 404, which Google reports as such.
# Unmatched paths now fall through to dist/404.html with a real 404 status.
# Verify after deploy: curl -I https://teamrileyweb.com/does-not-exist

[build.environment]
  # 22, not 18: `npm run build` runs the unit tests before it builds, and vitest 4
  # requires ^20 || ^22 || >=24, so every site failed on the first command with exit
  # code 2. Astro 5 and Vite 6 are both happy on 22.
  NODE_VERSION = "22"
